  # Knowledge Base and OpenSearch Index Configuration
  OpenSearchIndexFunction:
      Type: AWS::Lambda::Function
      DependsOn: S3VPCEndpoint
      Properties:
        FunctionName: !Sub 'opensearch-index-function-${Environment}-${AWS::AccountId}-${RandomPrefix}'
        Runtime: python3.9
        Handler: index.lambda_handler
        Role: !GetAtt OpenSearchIndexFunctionRole.Arn
        Tags:
          - Key: Application
            Value: idmaresource         
        Code:
          ZipFile: |
            import json
            import boto3
            import cfnresponse
            from opensearchpy import OpenSearch, RequestsHttpConnection, AWSV4SignerAuth
            import time
            import urllib3
            from botocore.config import Config

            # Increase timeout for urllib3
            urllib3.Timeout._DEFAULT_TIMEOUT = 60

            def send_response_with_retry(event, context, response_status, reason=None, response_data=None, physical_resource_id=None):
                try:
                    cfnresponse.send(event, context, response_status, response_data or {}, physical_resource_id)
                    return True
                except Exception as e:
                    print(f"Error sending response: {str(e)}")
                    return False

            def lambda_handler(event, context):
                try:
                    print("Event:", event)
                    
                    # For Delete operations, send success immediately
                    if event['RequestType'] == 'Delete':
                        # Try 3 times to send success response
                        for i in range(3):
                            if send_response_with_retry(event, context, cfnresponse.SUCCESS):
                                return
                            time.sleep(1)
                        return  # Continue with deletion even if we can't confirm

                    if event['RequestType'] in ['Create', 'Update']:
                        region = event['ResourceProperties']['Region']
                        collection_endpoint = event['ResourceProperties']['CollectionEndpoint']
                        index_name = event['ResourceProperties']['IndexName']
                        
                        # Configure boto3 with higher timeouts
                        config = Config(
                            connect_timeout=60,
                            read_timeout=60,
                            retries={'max_attempts': 3}
                        )
                        session = boto3.Session()
                        credentials = session.get_credentials()
                        
                        auth = AWSV4SignerAuth(credentials, region, 'aoss')
                        host = collection_endpoint.replace("https://", "")
                        
                        client = OpenSearch(
                            hosts=[{'host': host, 'port': 443}],
                            http_auth=auth,
                            use_ssl=True,
                            verify_certs=True,
                            connection_class=RequestsHttpConnection,
                            timeout=60,
                            max_retries=3,
                            retry_on_timeout=True
                        )
                        
                        index_body = {
                            "settings": {"index": {"knn": True}},
                            "mappings": {
                                "properties": {
                                    "vector_field": {
                                        "type": "knn_vector",
                                        "dimension": 512,
                                        "method": {
                                            "name": "hnsw",
                                            "engine": "faiss",
                                            "parameters": {"ef_construction": 128, "m": 24}
                                        }
                                    },
                                    "AMAZON_BEDROCK_METADATA": {"type": "text", "index": False},
                                    "AMAZON_BEDROCK_TEXT_CHUNK": {"type": "text", "index": True}
                                }
                            }
                        }
                        
                        response = client.indices.create(index=index_name, body=index_body, ignore=400)
                        print("OpenSearch create index response:", response)
                        print(f"Waiting for index {index_name} to be ready...")
                        time.sleep(30) 
                        # Send success response with retry
                        for i in range(3):
                            if send_response_with_retry(event, context, cfnresponse.SUCCESS, 
                                                      response_data={'IndexName': index_name}):
                                return
                            time.sleep(1)
                        
                except Exception as e:
                    print(f"Error: {str(e)}")
                    # Try to send failure response with retry
                    for i in range(3):
                        if send_response_with_retry(event, context, cfnresponse.FAILED, 
                                                  reason=str(e)):
                            return
                        time.sleep(1)
        Timeout: 60
        MemorySize: 512
        ReservedConcurrentExecutions: 5
        VpcConfig:
          SecurityGroupIds:
            - !Ref LambdaSecurityGroup
